name: Sync live and final results

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plan result sync window
        id: plan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: wc2026_state
          SUPABASE_ROW_ID: global
          RESULT_PLAN_ONLY: "1"
          LIVE_SCORE_SYNC: "1"
        run: node scripts/sync-fifa-results.mjs

      - name: Install Playwright
        if: steps.plan.outputs.should_fetch == 'true' && steps.plan.outputs.need_playwright == 'true'
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Sync live/final results to Supabase
        if: steps.plan.outputs.should_fetch == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: wc2026_state
          SUPABASE_ROW_ID: global
          LIVE_SCORE_SYNC: "1"
        run: node scripts/sync-fifa-results.mjs
